# .github/workflows/OmegaBot.yml
name: OmegaBot

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: OmegaBot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: 🎨 Prettier · ✨ ESLint · 🛠️ TypeScript
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Build App (Vite)
        run: npm run build
