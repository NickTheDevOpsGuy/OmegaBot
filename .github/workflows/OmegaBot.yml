# .github/workflows/OmegaBot.yml
name: 🤖 OmegaBot

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Discord E2E job"
        required: false
        default: "true"
      audit_level:
        description: "npm audit level (low|moderate|high|critical)"
        required: false
        default: "high"

concurrency:
  group: OmegaBot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: 🤖 OmegaBot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📌 Discord.js version check
        run: npm run check:discord

      - name: 🧪 Run Tests
        run: npm run test:run

      - name: 📊 Test coverage
        run: npm run test:coverage

      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: 📤 Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: coverage/
          fail_ci_if_error: false

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🧪 TypeScript typecheck
        run: npm run typecheck

      - name: 🔨 Build
        run: npm run build

      - name: 🎨 Prettier check
        run: npm run format:check

      - name: 🔒 npm audit
        run: npm audit --audit-level=${{ github.event.inputs.audit_level || 'high' }}
        continue-on-error: true

  e2e:
    name: 🧪 E2E (Discord)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-typecheck

    # Run automatically for PRs; for manual runs, respect the input toggle
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_e2e == 'true' || github.event.inputs.run_e2e == 'True'))

    defaults:
      run:
        working-directory: .

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🧰 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 E2E Test (Discord)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
          E2E_TIMEOUT_MS: 120000
        run: npm run test:e2e
